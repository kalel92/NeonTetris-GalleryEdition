name: Build Executables

on:
  push:
    branches: [ "desktop-version" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy pygame-ce

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: python -m PyInstaller --onefile --windowed --name "NeonTetrisPro_Win" main.py

    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: python -m PyInstaller --onefile --windowed --name "NeonTetrisPro_Linux" main.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NeonTetrisPro-${{ matrix.os }}
        path: dist/NeonTetrisPro_*

